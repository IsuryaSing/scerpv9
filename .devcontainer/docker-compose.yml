services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/scerpv9:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: scerpv9
      POSTGRES_USER: scerpv9
      POSTGRES_PASSWORD: scerpv9_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scerpv9 -d scerpv9"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
